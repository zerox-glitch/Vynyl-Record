# JVM arguments for the Gradle daemon. The default heap is too small for Compose + Room + KSP.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# Build performance.
org.gradle.parallel=true
# Configuration cache is left off deliberately: the instrumentation and lint tasks are the ones a
# reader will run first, and a cold configuration-cache miss on a first build is a confusing failure
# mode for a project nobody has built yet.
org.gradle.caching=true

# AndroidX is required by every dependency this app uses.
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=true

kotlin.code.style=official
ksp.incremental=true
